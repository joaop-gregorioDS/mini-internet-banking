name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (.NET 8) - build e testes
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restaurar dependências
        run: dotnet restore MiniBanking.sln

      - name: Compilar
        run: dotnet build MiniBanking.sln --no-restore -c Release

      # Os testes de integração sobem um SQL Server 2022 em container (Testcontainers),
      # por isso o runner ubuntu-latest precisa do Docker, que já vem instalado.
      - name: Testes
        run: dotnet test MiniBanking.sln --no-build -c Release --logger "trx;LogFileName=results.trx"

      - name: Publicar resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-results
          path: api/**/TestResults/*.trx
          if-no-files-found: ignore

  web:
    name: Web (Angular 22) - testes e build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Instalar dependências (lockfile)
        run: npm ci

      - name: Verificar formatação (Prettier)
        run: npx prettier --check "src/**/*.{ts,html,css}"

      - name: Testes unitários
        run: npx ng test --watch=false

      - name: Build de produção
        run: npx ng build --configuration production

  docker:
    name: Imagens Docker - build
    runs-on: ubuntu-latest
    needs: [api, web]
    steps:
      - uses: actions/checkout@v4

      - name: Validar docker-compose.yml
        env:
          # Valores só para validar a sintaxe do compose; nada é executado.
          MSSQL_SA_PASSWORD: CiBuild!2026x
          JWT_KEY: chave-de-ci-com-mais-de-32-caracteres
        run: docker compose config --quiet

      - name: Build da API
        run: docker build -t mini-banking-api:ci ./api

      - name: Build do front
        run: docker build -t mini-banking-web:ci ./web
