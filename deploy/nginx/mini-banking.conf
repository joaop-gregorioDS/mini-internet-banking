# Nginx do HOST da VPS (não é o nginx do container do front).
# Faz o HTTPS e encaminha tudo para o container web em 127.0.0.1:4201.
# Copie para /etc/nginx/sites-available/mini-banking, troque mini-banking.vortexsoftware.tech e ative (ver deploy/README.md).

# Limite de requisições para o login/cadastro/refresh (proteção básica contra força bruta).
# Fica no contexto http (este arquivo é incluído dentro dele pelo nginx).
limit_req_zone $binary_remote_addr zone=mb_auth:10m rate=5r/s;

server {
    listen 80;
    listen [::]:80;
    server_name mini-banking.vortexsoftware.tech;

    # Desafio do Let's Encrypt (webroot). O resto redireciona para HTTPS.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mini-banking.vortexsoftware.tech;

    ssl_certificate     /etc/letsencrypt/live/mini-banking.vortexsoftware.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mini-banking.vortexsoftware.tech/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Cabeçalhos de segurança básicos.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 1m;

    location ^~ /api/auth/ {
        limit_req zone=mb_auth burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:4201;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:4201;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
